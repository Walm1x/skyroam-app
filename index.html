<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- Обязательный тег масштабирования по заданию -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkyRoam | Главная</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">SkyRoam ✈️</a>
      <ul class="nav-links">
        <li><a href="index.html">Главная</a></li>
        <li><a href="catalog.html">Поиск рейсов</a></li>
        <li><a href="profile.html">Мой профиль</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Куда летим сегодня?</h1>
      <form action="catalog.html">
        <div class="form-row">
          <div class="form-group">
            <label>Город вылета</label>
            <input type="text" placeholder="Например, Москва">
          </div>
          <div class="form-group">
            <label>Город прибытия</label>
            <input type="text" placeholder="Например, Берлин">
          </div>
        </div>
        <div class="form-group">
          <label>Дата вылета</label>
          <input type="date">
        </div>
        <button type="submit" class="btn">Найти билеты</button>
      </form>
    </section>

    <section>
      <h2>Популярные направления</h2>
      <div class="grid">
        <div class="card">
          <h3>🇷🇺 Москва ➔ 🇩🇪 Берлин</h3>
          <p>от $249</p>
        </div>
        <div class="card">
          <h3>🇷🇺 Москва ➔ 🇫🇷 Париж</h3>
          <p>от $289</p>
        </div>
        <div class="card">
          <h3>🇷🇺 Москва ➔ 🇮🇹 Рим</h3>
          <p>от $215</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 SkyRoam App. Mobile First Layout.</p>
  </footer>

</html>
